# Критерии отбора для следующих этапов (пока не используются кодом).
min_ref_domains: "10–30 по рынку, не считая The Globe, копий Википедии и прочего автоспама"
preferred_niches: [politics, society, travel, sports, history, games]
not_preferred_niches: [health, pets]
hard_no: [children, "personal sites (имяфамилия.tld)", porn]
